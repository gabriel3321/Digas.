<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Progresso ✦</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Vídeo de fundo -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="fundo.mp4" type="video/mp4">
    </video>

    <!-- Escurece um pouco o vídeo -->
    <div class="overlay"></div>

    <!-- Conteúdo -->
    <main class="card">

        <div class="simbolo">✦</div>

        <p class="subtitulo">JORNADA DE APRENDIZADO</p>

        <h1>Meu Progresso</h1>

        <div class="porcentagem">
            <span id="numero">0</span>%
        </div>

        <div class="barra">
            <div class="progresso"></div>
        </div>

        <p class="progresso-texto">
            CURSO CONCLUÍDO
        </p>

        <div class="linha"></div>

        <p class="mensagem">
            Estou na metade do curso, no caso,
            <strong>53,33%</strong>. 📚
            Mas não fiz esse site. Eu descobri que site é,
            infelizmente, somente JavaScript, e eu tô aprendendo .Lua.
            Mas .Lua eu estou sabendo. 😎
        </p>

        <div class="decoracao">
            ✦　✧　✦
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
